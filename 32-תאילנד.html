<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
    header { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1552465011-b4e21bf6e79a?auto=format&fit=crop&w=1600&q=80'); background-size: cover; color: white; padding: 100px 20px; text-align: center; }
    .container { max-width: 1000px; margin: 40px auto; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
    .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.3s; }
    .card:hover { transform: translateY(-10px); }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card-content { padding: 15px; }
    h2 { color: #2c3e50; border-right: 5px solid #27ae60; padding-right: 10px; }
    iframe { width: 100%; height: 400px; border-radius: 15px; margin-top: 20px; }
</style>
</head>
<body>

<header>
    <h1>גלו את הקסם של תאילנד</h1>
    <p>המדריך המלא ליעדים הכי מרהיבים בממלכת סיאם</p>
</header>

<div class="container">
    <h2>7 מקומות שאסור לפספס</h2>
    <div class="grid">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1582468357035-3253d7122a63?auto=format&fit=crop&w=800&q=80" alt="Bangkok">
            <div class="card-content"><h3>1. בנגקוק - הארמון הגדול</h3></div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" alt="Phuket">
            <div class="card-content"><h3>2. פוקט - חופי אנדמן</h3></div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1552465011-b4e21bf6e79a?auto=format&fit=crop&w=800&q=80" alt="Chiang Mai">
            <div class="card-content"><h3>3. צ'יאנג מאי - מקדשים והרים</h3></div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1543783207-ec64e4d95325?auto=format&fit=crop&w=800&q=80" alt="Koh Samui">
            <div class="card-content"><h3>4. קו סמוי - איים טרופיים</h3></div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1518548419970-58e3b4079ab2?auto=format&fit=crop&w=800&q=80" alt="Krabi">
            <div class="card-content"><h3>5. קראבי - צוקי גיר מרהיבים</h3></div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=800&q=80" alt="Pai">
            <div class="card-content"><h3>6. פאי - עיירת השאנטי</h3></div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1512100356356-de1b84283e74?auto=format&fit=crop&w=800&q=80" alt="Ayutthaya">
            <div class="card-content"><h3>7. איוטאיה - עיר עתיקה</h3></div>
        </div>
    </div>

    <h2>מיקום גיאוגרפי</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7775027.756209598!2d95.3402773294025!3d13.155513813936087!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x304d8df747424db1%3A0x9ed27c8816c7e3f6!2sThailand!5e0!3m2!1sen!2sil!4v1698754321000!5m2!1sen!2sil" allowfullscreen="" loading="lazy"></iframe>
</div>

</body>
</html>
